services:
  db:
    image: pgvector/pgvector:pg16
    container_name: inkloom_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: inkloom
      POSTGRES_PASSWORD: inkloom_password
      POSTGRES_DB: inkloom_db
    ports:
      - "5433:5432"   # <-- Host port 5433 mapped to container port 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inkloom -d inkloom_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: inkloom_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata: